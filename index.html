<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bấm vào đi</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== MÀN HÌNH CHÍNH ===== */
#mainScreen { text-align: center; padding: 30px; max-width: 500px; }
#mainScreen h1 {
  font-size: 24px;
  color: #ff0050;
  letter-spacing: 3px;
  margin-bottom: 18px;
  text-shadow: 0 0 20px rgba(255, 0, 80, 0.8);
  animation: shake 0.4s infinite;
}
@keyframes shake {
  0%, 100% { transform: translate(0,0); }
  25% { transform: translate(-2px, 1px); }
  50% { transform: translate(2px, -1px); }
  75% { transform: translate(-1px, 2px); }
}
#mainScreen p {
  font-size: 14px;
  color: #8e8e93;
  margin-bottom: 24px;
  letter-spacing: 1px;
  line-height: 1.6;
}

/* Cài đặt */
.settings {
  background: rgba(30, 20, 50, 0.6);
  border: 1px solid #a855f7;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
  text-align: left;
}
.settings label {
  display: block;
  font-size: 12px;
  color: #c4b5fd;
  margin-bottom: 6px;
  font-weight: bold;
}
.settings input[type=range] {
  width: 100%;
  margin-bottom: 14px;
  accent-color: #ff0050;
}
.settings .val {
  color: #ff0050;
  font-weight: bold;
}

#startBtn {
  padding: 18px 50px;
  background: linear-gradient(135deg, #ff0050, #a855f7);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow: 0 0 40px rgba(255, 0, 80, 0.8);
  animation: pulse 1.5s infinite;
  font-family: inherit;
  width: 100%;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 0, 80, 0.6); }
  50% { box-shadow: 0 0 60px rgba(255, 0, 80, 1); }
}
#startBtn:active { transform: scale(0.95); }

/* ===== MÀN HÌNH SCARE ===== */
#scareScreen {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  z-index: 9999;
}
#scareFrame { width: 100%; height: 100%; border: none; }

#countdown {
  position: fixed;
  top: 20px; left: 20px;
  color: #ff0050;
  font-size: 22px;
  font-weight: 900;
  z-index: 10000;
  background: rgba(0,0,0,0.8);
  padding: 10px 18px;
  border-radius: 12px;
  font-family: monospace;
  border: 2px solid #ff0050;
}

#exitBtn {
  display: none;
  position: fixed;
  bottom: 30px; left: 50%;
  transform: translateX(-50%);
  padding: 16px 50px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  z-index: 10000;
  letter-spacing: 2px;
  box-shadow: 0 0 30px rgba(34, 197, 94, 0.8);
  font-family: inherit;
}
#exitBtn:active { transform: translateX(-50%) scale(0.95); }

#warning {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 70px;
  color: #ff0000;
  font-weight: 900;
  z-index: 10001;
  text-align: center;
  text-shadow: 0 0 40px #ff0000, 0 0 80px #ff0000;
  display: none;
  animation: flash 0.25s infinite;
  pointer-events: none;
}
@keyframes flash {
  0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.15); }
}

#bloodOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle, transparent 20%, rgba(255,0,0,0.7) 100%);
  z-index: 10000;
  display: none;
  pointer-events: none;
  animation: bloodPulse 0.35s infinite;
}
@keyframes bloodPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

#skullOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 220px;
  z-index: 10001;
  pointer-events: none;
  animation: skullFade 1.2s infinite;
}
@keyframes skullFade {
  0%, 100% { opacity: 0; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* Bot indicator */
#botPick {
  position: fixed;
  bottom: 20px; left: 20px;
  background: rgba(168, 85, 247, 0.9);
  color: #fff;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: bold;
  z-index: 10002;
  display: none;
  border: 1px solid #ec4899;
  font-family: monospace;
}
</style>
</head>
<body>

<!-- MÀN HÌNH CHÍNH -->
<div id="mainScreen">
  <h1>⚠️ CẢNH BÁO ⚠️</h1>
  <p>Web chứa nội dung kinh dị cực mạnh<br>Rung điện thoại + video hù + âm thanh hét<br>Bấm vào đồng nghĩa bạn tự chịu trách nhiệm</p>

  <div class="settings">
    <label>⏱️ Thời gian khóa (giây): <span class="val" id="durVal">5</span></label>
    <input type="range" id="durRange" min="2" max="30" value="5">

    <label>📳 Thời gian rung (giây): <span class="val" id="vibVal">5</span></label>
    <input type="range" id="vibRange" min="1" max="20" value="5">

    <label>💀 Cường độ rung: <span class="val" id="powVal">Mạnh</span></label>
    <input type="range" id="powRange" min="1" max="3" value="3">
  </div>

  <button id="startBtn">BẤM VÀO ĐI</button>
</div>

<!-- MÀN HÌNH SCARE -->
<div id="scareScreen">
  <div id="countdown">5</div>
  <iframe id="scareFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  <button id="exitBtn">THOÁT</button>
</div>

<div id="warning">😱 BOO! 😱</div>
<div id="bloodOverlay"></div>
<div id="skullOverlay">💀</div>
<div id="botPick">🤖 Bot chọn: ...</div>

<script>
/* ============================================================================
   DANH SÁCH VIDEO KINH DỊ — BOT TỰ CHỌN
   ============================================================================ */

var SCARY_VIDEOS = [
  { id: 'gV5dYn0P0RA', title: 'Scary Pop Up 1' },
  { id: 'CjNPDSvVDEc', title: 'Scary Pop Up 2' },
  { id: 'UZUv4dwkJbU', title: 'Ghost Jump Scare' },
  { id: 'kjVzHW8oWXQ', title: 'Ma hù kinh dị' },
  { id: 'm4YYNwCDb1U', title: 'Scary Pop Up 3' },
  { id: 'I_izvAbhExY', title: 'Ghost Scream' },
  { id: 'EV1e0P7aWvY', title: 'Jump Scare Classic' },
  { id: 'JVbNl9wIuZE', title: 'Horror Compilation' }
];

/* ============================================================================
   BIẾN TOÀN CỤC
   ============================================================================ */

var audioCtx = null;
var countdownTimer = null;
var vibrateTimer = null;
var escBlocked = true;
var duration = 5;
var vibrateDur = 5;
var vibratePower = 3;

/* ============================================================================
   ÂM THANH HÉT (Web Audio API)
   ============================================================================ */

function initAudio() {
  try {
    var AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}

function playScream() {
  if (!audioCtx) return;
  var now = audioCtx.currentTime;

  var osc1 = audioCtx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(1200, now);
  osc1.frequency.exponentialRampToValueAtTime(600, now + 1.2);
  var g1 = audioCtx.createGain();
  g1.gain.setValueAtTime(0.18, now);
  g1.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
  osc1.connect(g1);
  g1.connect(audioCtx.destination);
  osc1.start(now);
  osc1.stop(now + 1.2);

  var osc2 = audioCtx.createOscillator();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(800, now);
  osc2.frequency.exponentialRampToValueAtTime(300, now + 1.5);
  var g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.12, now);
  g2.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
  osc2.connect(g2);
  g2.connect(audioCtx.destination);
  osc2.start(now);
  osc2.stop(now + 1.5);

  var bufferSize = audioCtx.sampleRate * 1.5;
  var noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  var data = noiseBuffer.getChannelData(0);
  for (var i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  var noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;
  var nf = audioCtx.createBiquadFilter();
  nf.type = 'highpass';
  nf.frequency.value = 2000;
  var ng = audioCtx.createGain();
  ng.gain.value = 0.18;
  noise.connect(nf);
  nf.connect(ng);
  ng.connect(audioCtx.destination);
  noise.start(now);
}

function playWhisper() {
  if (!audioCtx) return;
  var now = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, now);
  osc.frequency.linearRampToValueAtTime(80, now + 3);
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.1, now + 0.5);
  g.gain.linearRampToValueAtTime(0.02, now + 3);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 3);
}

/* ============================================================================
   RUNG ĐIỆN THOẠI — NHƯ CÓ CUỘC GỌI ĐẾN
   ============================================================================ */

function vibratePattern(power) {
  if (!navigator.vibrate) {
    console.log('Thiết bị không hỗ trợ rung');
    return;
  }

  // Pattern giống cuộc gọi đến
  var patterns = {
    1: [200, 100],                                          // nhẹ
    2: [400, 100, 400, 100],                                // vừa
    3: [500, 80, 500, 80, 500, 300]                         // mạnh — như gọi điện
  };

  navigator.vibrate(patterns[power] || patterns[3]);
}

function startVibrationLoop() {
  var endTime = Date.now() + (vibrateDur * 1000);

  function loop() {
    if (Date.now() >= endTime) {
      navigator.vibrate(0);
      return;
    }
    vibratePattern(vibratePower);
    vibrateTimer = setTimeout(loop, 2000);
  }

  loop();
}

function stopVibration() {
  if (vibrateTimer) clearTimeout(vibrateTimer);
  if (navigator.vibrate) navigator.vibrate(0);
}

/* ============================================================================
   HIỆU ỨNG HÌNH ẢNH
   ============================================================================ */

function showBoo() {
  var w = document.getElementById('warning');
  w.style.display = 'block';
  setTimeout(function() { w.style.display = 'none'; }, 800);
}

function startBlood() {
  document.getElementById('bloodOverlay').style.display = 'block';
}

function stopBlood() {
  document.getElementById('bloodOverlay').style.display = 'none';
}

function startSkull() {
  document.getElementById('skullOverlay').style.display = 'flex';
}

function stopSkull() {
  document.getElementById('skullOverlay').style.display = 'none';
}

function shakeScreen() {
  document.body.style.animation = 'shake 0.1s infinite';
  setTimeout(function() { document.body.style.animation = ''; }, 1500);
}

/* ============================================================================
   CHẶN PHÍM THOÁT
   ============================================================================ */

function blockKeys(e) {
  if (!escBlocked) return;
  if (e.key === 'Escape' || e.key === 'F5' || e.key === 'F11') {
    e.preventDefault(); e.stopPropagation(); return false;
  }
  if (e.ctrlKey && (e.key === 'w' || e.key === 'W' || e.key === 'r' || e.key === 'R')) {
    e.preventDefault(); e.stopPropagation(); return false;
  }
  if (e.altKey && e.key === 'F4') {
    e.preventDefault(); e.stopPropagation(); return false;
  }
}
document.addEventListener('keydown', blockKeys, true);

/* ============================================================================
   BOT CHỌN VIDEO
   ============================================================================ */

function botPickVideo() {
  var idx = Math.floor(Math.random() * SCARY_VIDEOS.length);
  var v = SCARY_VIDEOS[idx];

  var ind = document.getElementById('botPick');
  ind.textContent = '🤖 Bot đã chọn: ' + v.title;
  ind.style.display = 'block';

  return v;
}

/* ============================================================================
   HÀM CHÍNH
   ============================================================================ */

function startScare() {
  initAudio();

  duration = parseInt(document.getElementById('durRange').value);
  vibrateDur = parseInt(document.getElementById('vibRange').value);
  vibratePower = parseInt(document.getElementById('powRange').value);

  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('scareScreen').style.display = 'block';

  // Bot chọn video
  var video = botPickVideo();
  var frame = document.getElementById('scareFrame');
  frame.src = 'https://www.youtube.com/embed/' + video.id + '?autoplay=1&controls=0&rel=0&showinfo=0&modestbranding=1&playsinline=1';

  // Hiệu ứng
  showBoo();
  startBlood();
  startSkull();
  shakeScreen();

  // Âm thanh
  setTimeout(playScream, 200);
  setTimeout(playWhisper, 800);

  // RUNG như cuộc gọi đến
  startVibrationLoop();

  // Đếm ngược
  var timeLeft = duration;
  var cd = document.getElementById('countdown');
  cd.textContent = timeLeft;

  countdownTimer = setInterval(function() {
    timeLeft--;
    cd.textContent = timeLeft;

    if (timeLeft === duration - 1) playWhisper();
    if (timeLeft === Math.floor(duration / 2)) playScream();

    if (timeLeft <= 0) {
      clearInterval(countdownTimer);
      cd.style.display = 'none';
      document.getElementById('exitBtn').style.display = 'block';
      escBlocked = false;
      stopBlood();
      stopSkull();
      stopVibration();
    }
  }, 1000);
}

/* ============================================================================
   THOÁT
   ============================================================================ */

function exitScare() {
  clearInterval(countdownTimer);
  escBlocked = false;

  document.getElementById('scareScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('scareFrame').src = '';
  document.getElementById('countdown').style.display = 'block';
  document.getElementById('exitBtn').style.display = 'none';
  document.getElementById('botPick').style.display = 'none';

  stopBlood();
  stopSkull();
  stopVibration();

  document.body.style.animation = '';
}

/* ============================================================================
   GẮN SỰ KIỆN
   ============================================================================ */

document.getElementById('durRange').addEventListener('input', function() {
  document.getElementById('durVal').textContent = this.value;
});

document.getElementById('vibRange').addEventListener('input', function() {
  document.getElementById('vibVal').textContent = this.value;
});

document.getElementById('powRange').addEventListener('input', function() {
  var labels = { 1: 'Nhẹ', 2: 'Vừa', 3: 'Mạnh' };
  document.getElementById('powVal').textContent = labels[this.value];
});

document.getElementById('startBtn').addEventListener('click', startScare);
document.getElementById('exitBtn').addEventListener('click', exitScare);

console.log('Scare Page v3 — Ready · ' + SCARY_VIDEOS.length + ' videos');
</script>
</body>
  </html>
